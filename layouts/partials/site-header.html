{{- /*
  The header on every page except the home page: the navigation bar, then the page title and description.
  Styles: assets/ananke/css/header.css.
*/ -}}
<header>
  {{ partials.Include "site-navigation.html" . }}
  <div class="page-header">
    <h1 class="page-header__title">{{ .Title | default site.Title }}</h1>
    {{- with .Params.description }}
      <p class="page-header__description">{{ . }}</p>
    {{- end }}
  </div>
</header>
