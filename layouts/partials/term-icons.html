{{- /* Seasonal term icons (set "icon:" on a term in data/terms.yaml: maple, snowflake, flower or sun).
       Simple shapes drawn in currentColor so they stay readable when small and take the term's color.
       Use as <svg><use href="#ico-term-maple"/></svg>. Include once per page. */ -}}
<svg width="0" height="0" class="visually-hidden" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="ico-term-maple" viewBox="-12 -12 24 24">
      <path fill="currentColor" d="M0,-11 L2.4,-6 L5.4,-7.4 L4.4,-2.6 L10.5,-3.8 L8.4,0 L10.5,2.2 L4.2,3.2 L4.8,6 L1.2,4.8 L1,7.6 L-1,7.6 L-1.2,4.8 L-4.8,6 L-4.2,3.2 L-10.5,2.2 L-8.4,0 L-10.5,-3.8 L-4.4,-2.6 L-5.4,-7.4 L-2.4,-6 Z"/>
      <path d="M0,6.5 Q0.4,9.5 1.6,11.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>

    <!-- six arms, each with one clear "V" so it reads as a flake even when small -->
    <g id="ico-term-snow-arm"><path d="M0,0 V-10.5 M-3.4,-9.2 L0,-6 L3.4,-9.2"/></g>
    <symbol id="ico-term-snowflake" viewBox="-12 -12 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <use href="#ico-term-snow-arm"/><use href="#ico-term-snow-arm" transform="rotate(60)"/><use href="#ico-term-snow-arm" transform="rotate(120)"/>
        <use href="#ico-term-snow-arm" transform="rotate(180)"/><use href="#ico-term-snow-arm" transform="rotate(240)"/><use href="#ico-term-snow-arm" transform="rotate(300)"/>
      </g>
    </symbol>

    <!-- five round petals around an open center -->
    <ellipse id="ico-term-petal" cx="0" cy="-6" rx="3.6" ry="4.6"/>
    <symbol id="ico-term-flower" viewBox="-12 -12 24 24">
      <g fill="currentColor">
        <use href="#ico-term-petal"/><use href="#ico-term-petal" transform="rotate(72)"/><use href="#ico-term-petal" transform="rotate(144)"/>
        <use href="#ico-term-petal" transform="rotate(216)"/><use href="#ico-term-petal" transform="rotate(288)"/>
      </g>
      <circle r="2.6" fill="#fff"/>
    </symbol>

    <!-- a round sun with eight short rays -->
    <symbol id="ico-term-sun" viewBox="-12 -12 24 24">
      <circle r="5" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M0,-8 V-11 M0,8 V11 M-8,0 H-11 M8,0 H11 M5.7,-5.7 L7.8,-7.8 M-5.7,5.7 L-7.8,7.8 M5.7,5.7 L7.8,7.8 M-5.7,-5.7 L-7.8,-7.8"/>
      </g>
    </symbol>
  </defs>
</svg>
